<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#101214">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>AIR LAB NEWS</title>
<style>
  :root {
    --bg: #101214; --card: #191c20; --line: #262a30; --fg: #eceef1; --dim: #8b929c; --acc: #4f8cff;
    --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; overflow-x: hidden; max-width: 100vw; background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 16px; }
  a { color: inherit; text-decoration: none; }
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: var(--bg); padding-top: var(--top); border-bottom: 1px solid var(--line); transform: translateZ(0); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; }
  .bar h1 { font-size: 17px; margin: 0; letter-spacing: .04em; font-weight: 700; }
  .bar .upd { font-size: 12px; color: var(--dim); margin-left: auto; }
  .bar button { background: none; border: 0; color: var(--fg); font-size: 20px; padding: 4px 6px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 10px 8px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 7px 13px; border-radius: 8px; font-size: 14px; font-weight: 700; color: #fff; opacity: .55; background: #444; }
  .tab.on { opacity: 1; box-shadow: 0 0 0 2px #fff3 inset; }
  .wx { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); font-size: 14px; }
  .wx .big { font-size: 26px; line-height: 1; }
  .wx .t { font-size: 22px; font-weight: 700; }
  .wx .sub { color: var(--dim); font-size: 12px; }
  .wx .days { display: flex; gap: 8px; margin-left: auto; }
  .wx .day { text-align: center; font-size: 11px; color: var(--dim); }
  .wx .day b { display: block; color: var(--fg); font-size: 12px; white-space: nowrap; }
  .wx .radar { flex: 0 0 auto; margin-left: 4px; padding: 8px 10px; border-radius: 8px; background: #23364f; color: #bcd6ff; font-size: 12px; font-weight: 700; }
  .wxtext { padding: 6px 14px 8px; font-size: 12px; color: var(--dim); background: var(--card); border-bottom: 1px solid var(--line); }
  body { padding-top: var(--head, 96px); }   /* header の高さぶん。JSで実測して --head に入れる */
  main { padding-bottom: calc(40px + var(--bot)); }
  .sec { padding: 14px 14px 4px; font-size: 13px; font-weight: 700; color: var(--dim); letter-spacing: .06em; }
  .item { display: flex; gap: 12px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
  .item .tx { flex: 1; min-width: 0; }
  .item .ti { font-size: 16px; line-height: 1.4; font-weight: 600; }
  .item .sm { font-size: 13px; color: var(--dim); line-height: 1.4; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .mt { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .item img { flex: 0 0 96px; width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: #222; }
  .item.read { opacity: .45; }
  .item, .cluster { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .sheet .chip { padding: 9px 12px; border-radius: 20px; background: #2a2f37; color: var(--fg); font-size: 14px; font-weight: 600; border: 0; flex: none; }
  .sheet .chip.on { background: #6b2b2b; color: #ffd9d9; }
  .sheet .chip.src { background: #23364f; color: #bcd6ff; }
  .mtitle { font-size: 14px; line-height: 1.4; color: var(--dim); margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mutedlist { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .sheet .mutedlist .chip { font-size: 12px; padding: 6px 10px; }
  .cluster { margin: 8px 14px; padding: 12px 14px; border-radius: 12px; background: linear-gradient(160deg, #1d2634, #171b22); border: 1px solid #2b3646; }
  .cluster .ti { font-size: 17px; font-weight: 700; line-height: 1.4; }
  .cluster .src { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cluster .src a { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #ffffff14; color: #cfd8e3; }
  .empty { padding: 40px 20px; text-align: center; color: var(--dim); font-size: 14px; }
  .fab { position: fixed; right: 16px; bottom: calc(16px + var(--bot)); width: 48px; height: 48px; border-radius: 50%; background: var(--acc); color: #fff; border: 0; font-size: 22px; box-shadow: 0 6px 20px #0008; }
  .fab.spin { animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: calc(80px + var(--bot)); transform: translateX(-50%); background: #2a2f37; color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 13px; opacity: 0; transition: .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .sheet { position: fixed; inset: 0; background: #0009; display: none; z-index: 20; }
  .sheet.on { display: block; }
  .sheet .box { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + var(--bot)); }
  .sheet h2 { font-size: 15px; margin: 0 0 6px; }
  .sheet p { font-size: 12px; color: var(--dim); margin: 0 0 8px; }
  .sheet textarea { width: 100%; height: 120px; background: #0e1012; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 15px; }
  .sheet .row { display: flex; gap: 8px; margin-top: 10px; }
  .sheet button { flex: 1; padding: 12px; border-radius: 10px; border: 0; font-size: 15px; font-weight: 700; background: #2a2f37; color: var(--fg); }
  .sheet button.pri { background: var(--acc); color: #fff; }
  .err { padding: 8px 14px; font-size: 11px; color: #a77; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>🛋️ AIR LAB NEWS</h1>
    <span class="upd" id="upd">読み込み中…</span>
    <button id="gear" title="設定">⚙︎</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div id="wx"></div>
<main id="main"><div class="empty">ニュースを読み込んでいます…</div></main>
<button class="fab" id="fab" title="更新">↻</button>
<div class="toast" id="toast"></div>

<div class="sheet" id="msheet">
  <div class="box">
    <h2>ミュート</h2>
    <p class="mtitle" id="mtitle"></p>
    <p>言葉を押すと、その言葉が入った記事を隠す</p>
    <div class="chips" id="mchips"></div>
    <div class="row">
      <button id="mhide">この記事だけ隠す</button>
      <button id="msrc">この媒体を隠す</button>
    </div>
  </div>
</div>
<div class="sheet" id="sheet">
  <div class="box">
    <h2>ミュートする言葉</h2>
    <p>1行に1つ。タイトルにこの言葉が入っている記事は表示しません。</p>
    <textarea id="mute" placeholder="例）&#10;占い&#10;PR"></textarea>
    <p style="margin-top:10px">隠している媒体（押すと戻す）</p>
    <div class="mutedlist" id="mutedSrc"></div>
    <div class="row">
      <button id="clearRead">既読を消す</button>
      <button id="pull">いま取り直す</button>
      <button class="pri" id="save">保存</button>
    </div>
    <p id="errs" class="err"></p>
  </div>
</div>

<script>
// ---------- 状態 ----------
let DATA = null, TABS = [], cur = ls('tab') || 'top';
let mute = (ls('mute') || '').split('\n').map(s => s.trim()).filter(Boolean);
let read = new Set(JSON.parse(ls('read') || '[]'));
let muteSrc = new Set(JSON.parse(ls('muteSrc') || '[]'));
let hidden = new Set(JSON.parse(ls('hidden') || '[]'));
let seen = new Set(JSON.parse(ls('seen') || '[]'));   // 「最新」に出したことがある記事
function ls(k, v) { try { if (v === undefined) return localStorage.getItem('aln_' + k); localStorage.setItem('aln_' + k, v); } catch (e) { return null; } }

// ---------- サーバー呼び出し ----------
// GASの中で開かれたら google.script.run、GitHub Pages なら GAS の ?api=、Mac上の試験なら data.json
const API_URL = 'https://script.google.com/macros/s/AKfycbyC3tP7PsaTlxPOW1KQNhSWAIo84KmKqf8C1nJifkYrn3w1SHDoP_xhiHNxc70Byz75/exec';
const LOCAL = location.protocol === 'file:' || location.hostname === 'localhost';
function call(fn) {
  if (window.google && google.script) {
    return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn]());
  }
  const api = { getTabs: 'tabs', getData: 'data', refreshNow: 'refresh' }[fn];
  const url = LOCAL ? (fn === 'getTabs' ? 'tabs.json' : 'data.json') : API_URL + '?api=' + api + '&t=' + Date.now();
  const get = () => fetch(url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
  return get().catch(() => new Promise(r => setTimeout(r, 2500)).then(get));   // たまに一瞬こけるので1回だけやり直す
}

// 前回の記事を端末に保存しておいて、開いた瞬間にまず出す。新しいのは裏で取りに行く
function loadCache() {
  try {
    const t = ls('tabs'), d = ls('data');
    if (t && d) { TABS = JSON.parse(t); DATA = JSON.parse(d); return true; }
  } catch (e) {}
  return false;
}
function saveCache() {
  try { ls('tabs', JSON.stringify(TABS)); ls('data', JSON.stringify(DATA)); } catch (e) {}
}
let pending = null;   // 届いたけどまだ画面に出していない新データ
function applyPending() { if (!pending) return; DATA = pending; pending = null; saveCache(); render(); }

async function load(force) {
  const hadCache = !!DATA;
  try {
    const [t, raw] = await Promise.all([
      TABS.length && !force ? Promise.resolve(TABS) : call('getTabs'),
      call(force ? 'refreshNow' : 'getData'),
    ]);
    const tabs = typeof t === 'string' ? JSON.parse(t) : t;
    const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!hadCache) { TABS = tabs; DATA = data; saveCache(); render(); return; }
    if (data.updated === DATA.updated && !force) return;      // 変わってない
    TABS = tabs; pending = data;
    if (force || window.scrollY < 80) applyPending();          // 上にいるなら静かに差し替え
    else toast('新しい記事あり。↻で入れ替え');
  } catch (e) {
    if (!hadCache) document.getElementById('main').innerHTML = '<div class="empty">読み込めなかった。<br>' + esc(String(e)) + '</div>';
    else toast('更新できなかった（前回のを表示中）');
  }
}

// ---------- 描画 ----------
function render() {
  renderTabs(); renderWeather(); renderList(); fitHeader();
  document.getElementById('upd').textContent = '更新 ' + hm(DATA.updated);
  document.getElementById('errs').textContent = ((DATA.errors || []).length ? '取れなかった媒体: ' + DATA.errors.join(' / ') + '\n' : '') + ((DATA.timing || []).length ? '取得時間: ' + DATA.timing.join(' / ') : '');
}

function fitHeader() { document.documentElement.style.setProperty('--head', document.querySelector('header').offsetHeight + 'px'); }
window.addEventListener('resize', fitHeader);

function renderTabs() {
  const all = [{ id: 'top', name: 'トップ', color: '#e0443f' }].concat(TABS);
  const el = document.getElementById('tabs');
  el.innerHTML = all.map(t => `<div class="tab ${t.id === cur ? 'on' : ''}" data-id="${t.id}" style="background:${t.color}">${esc(t.name)}</div>`).join('');
  el.querySelectorAll('.tab').forEach(t => t.onclick = () => { cur = t.dataset.id; ls('tab', cur); renderTabs(); renderList(); window.scrollTo(0, 0); });
  const on = el.querySelector('.on'); if (on) el.scrollLeft = on.offsetLeft - (el.clientWidth - on.offsetWidth) / 2;
}

const WX = { 0: '☀️', 1: '🌤', 2: '⛅️', 3: '☁️', 45: '🌫', 48: '🌫', 51: '🌦', 53: '🌦', 55: '🌧', 61: '🌧', 63: '🌧', 65: '🌧', 71: '🌨', 73: '🌨', 75: '❄️', 80: '🌦', 81: '🌧', 82: '⛈', 95: '⛈', 96: '⛈', 99: '⛈' };
function renderWeather() {
  const w = DATA.weather || {}; const el = document.getElementById('wx');
  if (!w.now) { el.innerHTML = ''; return; }
  const radar = 'https://www.jma.go.jp/bosai/nowc/#zoom:9/lat:35.50/lon:134.24/colordepth:normal/elements:hrpns';
  const days = (w.days || []).slice(0, 3).map((d, i) => `<div class="day">${i === 0 ? '今日' : i === 1 ? '明日' : '明後日'}<b>${WX[d.code] || '·'} ${d.max}°/${d.min}°</b>${d.pop != null ? d.pop + '%' : ''}</div>`).join('');
  el.innerHTML = `<div class="wx"><span class="big">${WX[w.now.code] || '·'}</span><div><div class="t">${w.now.temp}°</div><div class="sub">鳥取市</div></div><div class="days">${days}</div><a class="radar" href="${radar}" target="_blank">雨雲</a></div>`
    + (w.text ? `<div class="wxtext">${esc(w.text)}</div>` : '');
}

function visible(items) {
  return items.filter(it => !hidden.has(it.u) && !muteSrc.has(it.s) && !mute.some(m => it.t.includes(m)));
}

function renderList() {
  const main = document.getElementById('main');
  let html = '';
  if (cur === 'top') {
    const japan = visible(DATA.tabs.japan || []);
    const clusters = clusterize(japan);
    if (clusters.length) {
      html += '<div class="sec">いま大きい話</div>';
      clusters.forEach(c => c.forEach(it => BYURL[it.u] = it));
      html += clusters.slice(0, 5).map(c => `<div class="cluster"><a class="ti" href="${c[0].u}" target="_blank" data-u="${c[0].u}">${esc(c[0].t)}</a><div class="src">${c.map(it => `<a href="${it.u}" target="_blank" data-u="${it.u}">${esc(it.s)}</a>`).join('')}</div></div>`).join('');
    }
    const used = new Set(clusters.flat().map(it => it.u));
    // 「最新」は、前に出した記事（seen）と既読を後ろに回して、開くたびに顔ぶれが変わるようにする
    const fresh = it => !seen.has(it.u) && !read.has(it.u);
    const pick = (items, n) => { const a = items.filter(fresh); const b = items.filter(it => !fresh(it)); return a.concat(b).slice(0, n); };
    // タブごとに候補を作って、順繰りに1本ずつ混ぜる（時間順にすると、記事の多い媒体ばかり上に来る）
    const groups = [];
    groups.push(pick(visible(DATA.tabs.local || []), 4).map(it => ({ ...it, tag: '鳥取県' })));
    groups.push(pick(japan.filter(it => !used.has(it.u)), 8));
    TABS.forEach(t => { if (t.id === 'japan' || t.id === 'local') return; groups.push(pick(visible(DATA.tabs[t.id] || []), 3).map(it => ({ ...it, tag: t.name }))); });
    const opens = (parseInt(ls('opens') || '0', 10) + 1) % 1000; ls('opens', String(opens));
    const start = opens % groups.length;                      // 開くたびに先頭のタブをずらす
    const order = groups.slice(start).concat(groups.slice(0, start));
    const mix = [];
    for (let i = 0; mix.length < 60; i++) {
      let any = false;
      order.forEach(g => { if (g[i]) { mix.push(g[i]); any = true; } });
      if (!any) break;
    }
    html += '<div class="sec">最新</div>' + mix.map(card).join('');
    mix.forEach(it => seen.add(it.u));
    if (seen.size > 600) seen = new Set([...seen].slice(-450));
    ls('seen', JSON.stringify([...seen]));
  } else {
    const items = visible(DATA.tabs[cur] || []);
    html = items.length ? items.map(card).join('') : '<div class="empty">まだ記事がない</div>';
  }
  main.innerHTML = html || '<div class="empty">表示できる記事がない</div>';
  main.querySelectorAll('[data-u]').forEach(a => {
    a.addEventListener('click', e => { if (suppressClick) { e.preventDefault(); suppressClick = false; return; } markRead(a.dataset.u); });
    attachLongPress(a);
  });
}

const BYURL = {};
function card(it) {
  BYURL[it.u] = it;
  const img = it.i ? `<img src="${it.i}" loading="lazy" alt="" onerror="this.remove()">` : '';
  return `<a class="item ${read.has(it.u) ? 'read' : ''}" href="${it.u}" target="_blank" data-u="${it.u}"><div class="tx"><div class="ti">${esc(it.t)}</div>${it.x ? `<div class="sm">${esc(it.x)}</div>` : ''}<div class="mt">${it.tag && it.tag !== it.s ? `<b>${esc(it.tag)}</b> · ` : ''}${esc(it.s)} · ${ago(it.d)}</div></div>${img}</a>`;
}

// 同じ話を書いている記事をまとめる（媒体が2つ以上のものだけ）
function clusterize(items) {
  const recent = items.filter(it => Date.now() - it.d < 36 * 3600000);
  const grams = recent.map(it => bigrams(it.t));
  const used = new Array(recent.length).fill(false);
  const out = [];
  for (let i = 0; i < recent.length; i++) {
    if (used[i]) continue;
    const c = [recent[i]]; used[i] = true;
    for (let j = i + 1; j < recent.length; j++) {
      if (used[j]) continue;
      if (sim(grams[i], grams[j]) >= 0.45) { c.push(recent[j]); used[j] = true; }
    }
    const srcs = new Set(c.map(it => it.s));
    if (srcs.size >= 2) {
      const uniq = []; const seen = new Set();
      c.forEach(it => { if (!seen.has(it.s)) { seen.add(it.s); uniq.push(it); } });
      out.push(uniq);
    }
  }
  return out.sort((a, b) => b.length - a.length || b[0].d - a[0].d);
}
function bigrams(t) {
  const s = t.replace(/[\s　、。・「」『』（）()【】\[\]!?！？:：\-–—~〜…]/g, '');
  const g = new Set(); for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2)); return g;
}
function sim(a, b) { if (!a.size || !b.size) return 0; let n = 0; a.forEach(x => { if (b.has(x)) n++; }); return n / Math.min(a.size, b.size); }

// ---------- 小物 ----------
function markRead(u) { read.add(u); if (read.size > 600) read = new Set([...read].slice(-500)); ls('read', JSON.stringify([...read])); document.querySelectorAll(`.item[data-u="${CSS.escape(u)}"]`).forEach(e => e.classList.add('read')); }
function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function hm(ms) { const d = new Date(ms); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
function ago(ms) { const m = Math.round((Date.now() - ms) / 60000); if (m < 1) return 'たった今'; if (m < 60) return m + '分前'; const h = Math.round(m / 60); if (h < 24) return h + '時間前'; return Math.round(h / 24) + '日前'; }
function toast(s) { const t = document.getElementById('toast'); t.textContent = s; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

document.getElementById('fab').onclick = async () => { const b = document.getElementById('fab'); if (pending) { applyPending(); window.scrollTo(0, 0); toast('入れ替えた'); return; } b.classList.add('spin'); await load(false); b.classList.remove('spin'); toast('更新した'); };
document.getElementById('gear').onclick = () => { document.getElementById('mute').value = mute.join('\n'); renderMutedSrc(); document.getElementById('sheet').classList.add('on'); };
document.getElementById('sheet').onclick = e => { if (e.target.id === 'sheet') e.target.classList.remove('on'); };
document.getElementById('save').onclick = () => { mute = document.getElementById('mute').value.split('\n').map(s => s.trim()).filter(Boolean); ls('mute', mute.join('\n')); document.getElementById('sheet').classList.remove('on'); renderList(); toast('保存した'); };
document.getElementById('clearRead').onclick = () => { read = new Set(); hidden = new Set(); seen = new Set(); ls('read', '[]'); ls('hidden', '[]'); ls('seen', '[]'); renderList(); toast('既読・非表示・表示履歴を消した'); };
document.getElementById('pull').onclick = async () => { document.getElementById('sheet').classList.remove('on'); const b = document.getElementById('fab'); b.classList.add('spin'); toast('集め直してる（20秒くらい）'); await load(true); b.classList.remove('spin'); toast('取り直した'); };

// ---------- 長押しでミュートメニュー ----------
let suppressClick = false;
function attachLongPress(el) {
  let timer = null;
  const start = () => { timer = setTimeout(() => { timer = null; suppressClick = true; openMuteMenu(el.dataset.u); }, 500); };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchmove', cancel, { passive: true });
  el.addEventListener('touchend', cancel, { passive: true });
  el.addEventListener('touchcancel', cancel, { passive: true });
  el.addEventListener('contextmenu', e => { e.preventDefault(); openMuteMenu(el.dataset.u); });
}
// タイトルを「ミュートに使えそうな言葉」に分ける（記号で切って、さらに漢字・カタカナ・英数のかたまりを拾う）
function words(t) {
  const out = []; const seen = new Set();
  const add = w => { w = w.trim(); if (w.length >= 2 && w.length <= 14 && !seen.has(w)) { seen.add(w); out.push(w); } };
  t.split(/[\s　、。・「」『』（）()【】\[\]!?！？:：\-–—~〜…,.\/｜|"”“'…]+/).forEach(chunk => {
    if (chunk.length <= 10) add(chunk);
    (chunk.match(/[\u4e00-\u9fff\u30a0-\u30ffA-Za-z0-9ー]+/g) || []).forEach(add);
  });
  return out.slice(0, 14);
}
let menuUrl = '';
function openMuteMenu(u) {
  const it = BYURL[u]; if (!it) return;
  menuUrl = u;
  document.getElementById('mtitle').textContent = it.t;
  document.getElementById('mchips').innerHTML = words(it.t).map(w => `<button class="chip ${mute.includes(w) ? 'on' : ''}" data-w="${esc(w)}">${esc(w)}</button>`).join('');
  document.getElementById('msrc').textContent = '「' + it.s + '」を隠す';
  document.getElementById('msheet').classList.add('on');
  document.querySelectorAll('#mchips .chip').forEach(b => b.onclick = () => {
    const w = b.dataset.w;
    if (mute.includes(w)) { mute = mute.filter(x => x !== w); b.classList.remove('on'); toast('「' + w + '」のミュートを外した'); }
    else { mute.push(w); b.classList.add('on'); toast('「' + w + '」をミュート'); }
    ls('mute', mute.join('\n')); renderList();
  });
}
document.getElementById('msheet').onclick = e => { if (e.target.id === 'msheet') e.target.classList.remove('on'); };
document.getElementById('mhide').onclick = () => { hidden.add(menuUrl); if (hidden.size > 800) hidden = new Set([...hidden].slice(-600)); ls('hidden', JSON.stringify([...hidden])); document.getElementById('msheet').classList.remove('on'); renderList(); toast('この記事を隠した'); };
document.getElementById('msrc').onclick = () => { const it = BYURL[menuUrl]; if (!it) return; muteSrc.add(it.s); ls('muteSrc', JSON.stringify([...muteSrc])); document.getElementById('msheet').classList.remove('on'); renderList(); toast('「' + it.s + '」を隠した'); };
function renderMutedSrc() {
  const el = document.getElementById('mutedSrc');
  el.innerHTML = muteSrc.size ? [...muteSrc].map(s => `<button class="chip src" data-s="${esc(s)}">${esc(s)} ×</button>`).join('') : '<span style="font-size:12px;color:var(--dim)">なし</span>';
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => { muteSrc.delete(b.dataset.s); ls('muteSrc', JSON.stringify([...muteSrc])); renderMutedSrc(); renderList(); toast('「' + b.dataset.s + '」を戻した'); });
}

// ---------- スワイプでタブ切り替え（本文の上で左右にはらう） ----------
function switchTab(dir) {
  const ids = ['top'].concat(TABS.map(t => t.id));
  const i = ids.indexOf(cur); const n = i + dir;
  if (n < 0 || n >= ids.length) return;
  cur = ids[n]; ls('tab', cur); renderTabs(); renderList(); window.scrollTo(0, 0);
}
(function () {
  let sx = 0, sy = 0, st = 0;
  const area = document.getElementById('main');
  area.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive: true });
  area.addEventListener('touchend', e => {
    const t = e.changedTouches[0]; const dx = t.clientX - sx; const dy = t.clientY - sy;
    if (Date.now() - st < 600 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) switchTab(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

if (loadCache()) render();
load(false);
