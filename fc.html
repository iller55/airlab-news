<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root { --bg:#101214; --card:#1a1d21; --fg:#e8e9ea; --dim:#8b9096; --line:#2a2e33; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 30px); }
  h1 { font-size:20px; margin:4px 0 14px; letter-spacing:.02em; }
  h1 small { color:var(--dim); font-weight:normal; font-size:13px; margin-left:8px; }
  .card { background:var(--card); border-radius:16px; padding:10px 10px 10px; margin-bottom:12px; border-left:5px solid var(--b,var(--c)); }
  .top { border:2px solid var(--bd,transparent); display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--t); background:var(--c); border-radius:14px; padding:8px 14px 8px 8px; margin-bottom:8px; font-size:17px; font-weight:700; }
  .logo { width:92px; height:60px; border-radius:10px; background:#fff; object-fit:contain; padding:6px; flex:none; }
  .card .fc { color:var(--dim); font-size:13px; margin:3px 0 10px; }
  .card .fc b { color:var(--fg); font-weight:600; }
  .links { display:flex; flex-wrap:wrap; gap:8px; }
  .links a { flex:1 1 40%; text-align:center; text-decoration:none; color:var(--fg); background:#24282d; border:1px solid var(--line); border-radius:12px; padding:12px 8px; font-size:15px; font-weight:600; }
    .links a.sub { font-weight:normal; color:var(--dim); font-size:13px; }
</style>
</head>

<script>
// 開いたら裏で最新版を取りに行き、バージョンが違えば読み直す（ホーム画面アプリのキャッシュ対策）
(async () => {
  try {
    const mine = document.querySelector('meta[name="fc-version"]').content;
    const r = await fetch('fc.html?t=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/name="fc-version" content="([^"]+)"/);
    if (m && m[1] !== mine && !sessionStorage.getItem('fc_reloaded_' + m[1])) {
      sessionStorage.setItem('fc_reloaded_' + m[1], '1');
      location.reload();
    }
  } catch (e) {}
})();
</script>
