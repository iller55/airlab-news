<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AIR LAB FC">
<meta name="theme-color" content="#101214">
<link rel="manifest" href="manifest-fc.json">
<link rel="apple-touch-icon" href="icon-fc-180.png">
<meta name="fc-version" content="2026-09-10b">
<title>AIR LAB FC</title>
<style>
  :root { --bg:#101214; --card:#1a1d21; --fg:#e8e9ea; --dim:#8b9096; --line:#2a2e33; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; padding:var(--head, 80px) 14px calc(env(safe-area-inset-bottom) + 30px); }
  /* ニュースと同じ固定ヘッダー（ステータスバーのぼかしが本文にかからないように、単色で覆う） */
  header { position:fixed; top:0; left:0; right:0; z-index:10; background:var(--bg); padding-top:env(safe-area-inset-top, 0px); border-bottom:1px solid var(--line); transform:translateZ(0); }
  .bar { display:flex; align-items:center; gap:10px; padding:10px 14px 6px; }
  .bar h1 { font-size:17px; margin:0; letter-spacing:.04em; font-weight:700; }
  .card { background:var(--card); border-radius:16px; padding:10px 10px 10px; margin-bottom:12px; }
  .top { position:relative; display:flex; align-items:center; justify-content:center; min-height:76px; border:2px solid var(--bd,transparent); text-decoration:none; color:var(--t); background:var(--c); border-radius:14px; padding:8px 14px; margin-bottom:8px; font-size:15px; font-weight:700; }
  .top span { text-align:center; }
  .logo { position:absolute; left:8px; top:50%; transform:translateY(-50%); width:92px; height:60px; border-radius:10px; background:#fff; object-fit:contain; padding:6px; }
  .card .fc { color:var(--dim); font-size:13px; margin:3px 0 10px; }
  .card .fc b { color:var(--fg); font-weight:600; }
  .links { display:flex; flex-wrap:wrap; gap:8px; }
  .links a { flex:1 1 40%; text-align:center; text-decoration:none; color:var(--fg); background:#24282d; border:1px solid var(--line); border-radius:12px; padding:12px 8px; font-size:15px; font-weight:600; }
    .links a.sub { font-weight:normal; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<header><div class="bar"><h1>🛋️ AIR LAB FC</h1></div></header>

<div class="card" style="--c:linear-gradient(100deg,#e11900 0%,#7e00bf 100%);--b:#7e00bf;--t:#fff">
  <a class="top" href="https://neverland-japan.com/" target="_blank" rel="noopener"><img class="logo" src="logos/idle-k.png" alt=""><span>NEVERLAND JAPAN</span></a>
  <div class="links">
    <a href="https://neverland-japan.com/mypage/" target="_blank" rel="noopener">MY PAGE</a>
    <a href="https://i-dle.cubeent.co.jp/" target="_blank" rel="noopener">OFFICIAL</a>
  </div>
</div>

<div class="card" style="--c:#e3b5c1;--t:#1a1a1a">
  <a class="top" href="https://babydontcryjapan.com/" target="_blank" rel="noopener"><img class="logo" src="logos/bdc-group-k.png" alt=""><span>Cherries JAPAN</span></a>
  <div class="links">
    <a href="https://babydontcryjapan.com/1/mypage/" target="_blank" rel="noopener">MY PAGE</a>
    <a href="https://www.instagram.com/babydontcry.offcl/" target="_blank" rel="noopener">Instagram</a>
  </div>
</div>

<div class="card" style="--c:#d40682;--t:#fff">
  <a class="top" href="https://ive-official.jp/mob/index.php?site=DIVE" target="_blank" rel="noopener"><img class="logo" src="logos/ive-mark-k.png" alt=""><span>DIVE JAPAN</span></a>
  <div class="links">
    <a href="https://fc.dps.amuse.co.jp/dive/mypage" target="_blank" rel="noopener">MY PAGE</a>
    <a href="https://www.instagram.com/ivestarship/" target="_blank" rel="noopener">Instagram</a>
  </div>
</div>

<div class="card" style="--c:#ffffff;--b:#ffffff;--t:#111">
  <a class="top" href="https://babymonster-official.jp/" target="_blank" rel="noopener"><img class="logo" src="logos/bm-word-k.png" alt=""><span>MONSTIEZ (JP)</span></a>
  <div class="links">
    <a href="https://babymonster-official.jp/s/ygbm/mypage" target="_blank" rel="noopener">MY PAGE</a>
    <a href="https://yg-babymonster-official.jp/" target="_blank" rel="noopener">OFFICIAL</a>
  </div>
</div>

  <a class="top" href="https://artist.mnetplus.world/main/stg/rescene-official/home" target="_blank" rel="noopener"><img class="logo" src="logos/rescene-dark-k.png" alt=""><span>REMINE</span></a>
  <div class="links">
    <a href="https://artist.mnetplus.world/main/stg/rescene-official/my" target="_blank" rel="noopener">MY PAGE</a>
    <a href="https://www.instagram.com/rescene_official/" target="_blank" rel="noopener">Instagram</a>
  </div>
</div>


<script>
function fitHeader() { document.documentElement.style.setProperty('--head', (document.querySelector('header').offsetHeight + 12) + 'px'); }
fitHeader(); window.addEventListener('resize', fitHeader);
// 開いたら裏で最新版を取りに行き、バージョンが違えば読み直す（ホーム画面アプリのキャッシュ対策）
(async () => {
  try {
    const mine = document.querySelector('meta[name="fc-version"]').content;
    const r = await fetch('fc.html?t=' + Date.now(), { cache: 'no-store' });
    const m = (await r.text()).match(/name="fc-version" content="([^"]+)"/);
    if (m && m[1] !== mine && !sessionStorage.getItem('fc_reloaded_' + m[1])) {
      sessionStorage.setItem('fc_reloaded_' + m[1], '1');
      location.reload();
    }
  } catch (e) {}
})();
</script>
</body>
</html>
